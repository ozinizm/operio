services:
  - type: web
    name: operio
    env: python
    region: frankfurt
    plan: free
    buildCommand: |
      # 1. Backend: Setup virtualenv and install requirements
      python -m venv .venv
      . .venv/bin/activate
      python -m pip install --upgrade pip
      python -m pip install -r backend/requirements.txt
      
      # 2. Verify dependencies
      python -c "import sqlalchemy, fastapi, uvicorn; print('Backend dependencies OK')"
      
      # 3. Frontend: Install and Build
      npm ci
      npm run build
      
      # 4. Backend: Ensure Seed
      cd backend && ../.venv/bin/python scripts/ensure_demo_seed.py
      
    startCommand: cd backend && ../.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Operio
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./operio_demo.db
      - key: UPLOAD_DIR
        value: storage/uploads
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: FRONTEND_DIST_DIR
        value: ../dist
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://operio.fikircreative.com"
